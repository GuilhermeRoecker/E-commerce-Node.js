<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Arôme - Loja</title>
  <link rel="stylesheet" href="../css/inicio.css" />
  <link rel="stylesheet" href="../css/loja.css" />
  <link rel="stylesheet" href="../css/componentes.css" />
  <link rel="stylesheet" href="../css/fontes.css" />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="../js/toast.js"></script>

  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'unsafe-inline';
  style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com 'unsafe-inline';
  font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
  img-src 'self' data: blob:;
  connect-src 'self';
  object-src 'none';
  base-uri 'self';
">


</head>

<body>
  <div class="modal">
    <div class="modal-overlay">
      <div class="modal-body rounded">
        <button id="btn-fechar-modal" class="close-btn">&times;</button>
        <div class="form-group">
          <label for="nome">Nome</label>
          <input id="nome" type="text" class="form-input" />
        </div>
        <div class="form-group">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" class="form-textarea"></textarea>
        </div>
        <div class="form-group">
          <label for="preco">Preço</label>
          <input id="preco" type="number" class="form-input" />
        </div>
        <div class="form-group">
          <label for="estoque">Estoque</label>
          <input id="estoque" type="number" class="form-input" />
        </div>
        <div class="form-group">
          <label for="categoria-select">Categoria</label>
          <select id="categoria-select" class="form-input"></select>
        </div>
        <div class="form-group">
          <label>Imagens (até 5)</label>
          <input id="images-input" type="file" multiple accept="image/*" />
        </div>
        <div class="modal-actions">
          <button id="cancelBtn" class="btn btn-outline">Cancelar</button>
          <button id="addBtn" class="btn btn-secondary">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="body">
    <div id="header">
      <h1>Arôme</h1>
      <p id="texto-usuario"></p>
      <button id="mudar-tema" class="button-1 rounded" title="Mudar tema">
        <i class="fa-solid fa-sun"></i>
      </button>

      <button id="btn-voltar" class="button-1 rounded" title="Voltar">&lt; Voltar</button>

    </div>

    <div id="sub-header" style="display:flex; justify-content:space-between; align-items:center;">
      <h2>Produtos</h2>

      <button id="btn-novo-produto" class="button-1 rounded">
        <i class="fa-solid fa-plus"></i> Novo Produto
      </button>

    </div>
    <div id="content"></div>
  </div>
  </div>


  <script src="../js/toast.js"></script>
  <script src="../js/mudarTema.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
  <script src="../functions/verificaAcesso.js"></script>
  <script>
    verificarAcesso({ cargosPermitidos: ['admin', 'dono-loja', 'vendedor'] });
  </script>
  <script src="../js/inicio/auth.js"></script>
  <script src="../js/inicio/produtos.js"></script>
  <script src="../js/inicio/interface.js"></script>
  <script src="../js/loja.js"></script>
</body>

</html>
