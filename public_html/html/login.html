<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arôme - Login</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/componentes.css">
    <link rel="stylesheet" href="../css/fontes.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Stalinist+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

      <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'unsafe-inline';
  style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com 'unsafe-inline';
  font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
  img-src 'self' data: blob:;
  connect-src 'self';
  object-src 'none';
  base-uri 'self';
">
</head>
<body>

<div id="login-model" class="rounded shadow padding" style="position: absolute;">
  <!-- Abas -->
  <div class="tabs">
    <button id="tab-login" class="tab active">Login</button>
    <button id="tab-cadastro" class="tab">Cadastro</button>
  </div>

  <!-- Conteúdo das abas -->
  <div class="tab-content">
    <div id="content-login" class="tab-panel active">
      <h1>Bem Vindo</h1>
      <p>Entre na sua conta</p>
      <input type="text" class="text-input rounded" id="email" placeholder="Usuário">
      <input type="password" class="text-input rounded" id="pass" placeholder="Senha">
      <button class="button-2 rounded" id="login-button" onclick="login()">Entrar</button>
    </div>

<div id="content-cadastro" class="tab-panel">
  <h1>Cadastro</h1>
  <p>Crie sua conta</p>
    <div style="display: flex; flex-direction: row;gap: 5px">
        <input type="text" class="text-input rounded" id="cadastro-nome" placeholder="Nome completo">
        <input type="text" class="text-input rounded" id="cadastro-nome-usuario" placeholder="Nome de usuário">
    </div>
  <input type="date" class="text-input rounded" id="cadastro-nascimento" placeholder="Data de nascimento">
    <div style="display: flex; flex-direction: row;gap: 5px">
        <input type="text" class="text-input rounded" id="cadastro-cpf" placeholder="CPF ou CNPJ">
        <select id="cadastro-tipo" class="text-input rounded">
            <option value="fisica">Pessoa Física</option>
            <option value="juridica">Pessoa Jurídica (CNPJ)</option>
        </select>
    </div>
    <input type="email" class="text-input rounded" id="cadastro-email" placeholder="Email">
    <div style="display: flex; flex-direction: row; gap: 5px">
        <input type="tel" class="text-input rounded" id="cadastro-telefone" placeholder="Telefone">
        <input type="tel" class="text-input rounded" id="cadastro-celular" placeholder="Celular">
    </div>
    <div style="display: flex; flex-direction: row; gap: 5px">
        <input type="password" class="text-input rounded" id="cadastro-senha" placeholder="Senha">
        <input type="password" class="text-input rounded" id="cadastro-senha-confirm" placeholder="Confirme a senha">
    </div>
  <input type="text" class="text-input rounded" id="cadastro-codigo" placeholder="Código de verificação">
    <div style="display: flex; flex-direction: row; gap: 5px">
        <button class="button-2 rounded" id="btn-enviar-codigo" style=" width: 168px" type="button">Enviar Código</button>
        <button class="button-2 rounded" id="btn-cadastrar" style=" width: 168px"onclick="cadastrar()">Cadastrar</button>
    </div>
    </div>
  </div>

  <button id="mudar-tema" class="button-1 rounded" style="margin-top: 10px;">
          ☀️
  </button>
</div>
<script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
<script src="../js/mudarTema.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
